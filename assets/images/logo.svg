<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 64" width="460" height="64" fill="none">
  <!-- SOKB Silicon NAND Gate Die Emblem (Based on official corporate mark) -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="8" fill="#0A0F1A" stroke="#D97706" stroke-width="1.5"/>
    
    <!-- Top-left orientation index dot -->
    <circle cx="12" cy="12" r="3" fill="#FFFFFF"/>
    
    <!-- Input Pins / Traces -->
    <rect x="0" y="21" width="13" height="3" fill="#FFFFFF"/>
    <rect x="0" y="32" width="13" height="3" fill="#FFFFFF"/>
    
    <!-- Output Pin / Trace -->
    <rect x="43" y="27" width="13" height="3" fill="#FFFFFF"/>
    
    <!-- NAND Gate Body -->
    <path d="M13 16 L28 16 C36 16 41 21 41 28.5 C41 36 36 41 28 41 L13 41 Z" fill="#FFFFFF"/>
    
    <!-- Inversion Bubble -->
    <circle cx="43" cy="28.5" r="3.2" fill="#FFFFFF"/>
    
    <!-- Vias (Circuit Rings) Top Right -->
    <circle cx="39" cy="8" r="2.2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="47" cy="8" r="2.2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="43" cy="14" r="2.2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="43" cy="20" r="2.2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    
    <!-- Vias Bottom Horizontal Row -->
    <circle cx="13" cy="48" r="2.2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="19" cy="48" r="2.2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="25" cy="48" r="2.2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="31" cy="48" r="2.2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="37" cy="48" r="2.2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="43" cy="48" r="2.2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="43" cy="40" r="2.2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
  </g>

  <!-- Brand Typography (Full Width Non-Truncating Matrix) -->
  <g transform="translate(74, 14)">
    <!-- SOKB Text -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="1" fill="#0F2042" class="logo-text-primary">SOKB</text>
    <!-- SEMICONDUCTOR Text (Full Width, zero clipping) -->
    <text x="76" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#D97706">SEMICONDUCTOR</text>
    <!-- Subtitle -->
    <text x="0" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="600" letter-spacing="1.2" fill="#64748B">SOVEREIGN RISC-V SILICON • ISM 2.0 DLI</text>
  </g>
</svg>
